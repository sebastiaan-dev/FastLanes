# ────────────────────────────────────────────────────────
# |                      FastLanes                       |
# ────────────────────────────────────────────────────────
# .github/workflows/compatibility.yaml
# ────────────────────────────────────────────────────────
name: C++ Compatibility
run-name: >-
  ${{ github.workflow }} on ${{ github.ref_name }} (#${{ github.run_number }})
  — ${{ github.event.pull_request.title || github.event.head_commit.message }}

on:
  # GitHub schedules ONLY the default branch, not integration/duckdb unless
  # that becomes the default. Use manual dispatch for other branches.
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
  push:
    # Version tags (including vX.Y.Z-rc.N): validation only, never publishing.
    tags: [ 'v*', '[0-9]*' ]
  pull_request:
    types: [ opened, reopened, synchronize, labeled ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full')
    name: build (${{ matrix.platform }}, ${{ matrix.build_type }})
    strategy:
      fail-fast: false
      matrix:
        platform: [ ubuntu-22.04, ubuntu-22.04-arm, macos-14, macos-15 ]
        build_type: [ Debug, Release ]
        include:
          - build_type: Release
            tests: true
          - platform: macos-15-intel
            build_type: Release
            tests: true
    uses: ./.github/workflows/cpp-build.yml
    with:
      platform: ${{ matrix.platform }}
      build-type: ${{ matrix.build_type }}
      tests: ${{ matrix.tests == true }}

  # Preserve libc++ lint and assertion-enabled macOS coverage off the PR path.
  clang-tidy:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full')
    uses: ./.github/workflows/cpp-lint.yml
    with:
      platform: macos-15
      build-type: Debug
      shared: 'ON'

  fsst:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full')
    runs-on: macos-latest
    env:
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: actions/checkout@v4
      - name: Detect CPU count
        run: make detect-cpu | tee -a "$GITHUB_ENV"
      - name: Install LLVM
        uses: ./.github/actions/install-llvm
      # Keep these flags, explicit targets, and test selection in sync with fsst.yaml.
      - name: Configure FSST
        run: |
          cmake -S "${{ github.workspace }}" \
                -B build/fsst-release \
                -DFLS_ENABLE_VERBOSE_OUTPUT=ON \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_C_COMPILER=clang \
                -DFLS_ENABLE_FSST_TESTING_AND_BENCHMARKING=ON \
                -DCMAKE_CXX_COMPILER=clang++
      - name: Build FSST targets
        run: cmake --build build/fsst-release --target test_fsst test_fls_fsst --parallel "$BUILD_THREADS"
      # Other registered cases need missing generated.csv or unsafe helper benchmarks.
      - name: Run FSST dbtext benchmarks
        run: >-
          ctest --test-dir build/fsst-release --output-on-failure --no-tests=error
          -R '^TestFsst\.fsst(12)?_dbtext$'

  compatibility-ci:
    if: always() && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full'))
    needs: [ build, clang-tidy, fsst ]
    runs-on: ubuntu-latest
    steps:
      - name: Require all compatibility checks to pass
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          TIDY_RESULT: ${{ needs.clang-tidy.result }}
          FSST_RESULT: ${{ needs.fsst.result }}
        run: |
          test "$BUILD_RESULT" = success
          test "$TIDY_RESULT" = success
          test "$FSST_RESULT" = success
