# ────────────────────────────────────────────────────────
# |                      FastLanes                       |
# ────────────────────────────────────────────────────────
# .github/workflows/fsst.yaml
# ────────────────────────────────────────────────────────
name: FSST
run-name: >-
  ${{ github.workflow }} on ${{ github.ref_name }} (#${{ github.run_number }})
  — ${{ github.event.pull_request.title || github.event.head_commit.message }}

# ──────────────────────────────────────────────────────────────────────────────
# Events
# ──────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [ main, dev, integration/duckdb ]
    tags: [ '**' ]
  pull_request:

# Cancel in-flight runs on the same branch/PR so we do not waste minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Global env (tweak once, use everywhere)
env:
  CMAKE_GENERATOR: Ninja            # much faster than Makefiles

jobs:
  # Linux PR coverage; macOS runs in the compatibility workflow.
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Detect CPU count
        shell: bash
        run: make detect-cpu | tee -a "$GITHUB_ENV"

      - name: Install LLVM
        uses: ./.github/actions/install-llvm

      - name: Configure FSST
        shell: bash
        run: |
          cmake -S "${{ github.workspace }}" \
                -B build/fsst-release \
                -DFLS_ENABLE_VERBOSE_OUTPUT=ON \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_C_COMPILER=clang \
                -DFLS_ENABLE_FSST_TESTING_AND_BENCHMARKING=ON \
                -DCMAKE_CXX_COMPILER=clang++

      - name: Build FSST targets
        run: cmake --build build/fsst-release --target test_fsst test_fls_fsst --parallel "$BUILD_THREADS"

      # The *_test_data cases require an untracked generated.csv. The helper
      # benchmarks have existing memory-safety issues; retain their build check
      # but run only upstream FSST/FSST12 on the checked-in dbtext corpora.
      - name: Run FSST dbtext benchmarks
        run: >-
          ctest --test-dir build/fsst-release --output-on-failure --no-tests=error
          -R '^TestFsst\.fsst(12)?_dbtext$'
