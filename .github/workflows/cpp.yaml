# ────────────────────────────────────────────────────────
# |                      FastLanes                       |
# ────────────────────────────────────────────────────────
# .github/workflows/cpp.yaml
# ────────────────────────────────────────────────────────
# Primary PR coverage; older images and macOS Debug/lint live in compatibility.yaml.
name: CPP
run-name: >-
  ${{ github.workflow }} on ${{ github.ref_name }} (#${{ github.run_number }})
  — ${{ github.event.pull_request.title || github.event.head_commit.message }}

on:
  push:
    branches: [ main, dev, integration/duckdb ]
    tags: [ '**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect CPU count
        run: make detect-cpu | tee -a "$GITHUB_ENV"
      - name: Test CI helpers
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'
      - name: Run format check
        run: make format-check

  build:
    needs: check-format
    name: build (${{ matrix.platform }}, ${{ matrix.build_type }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            build_type: Debug
            tests: false
            install_artifact: false
          - platform: ubuntu-24.04
            build_type: Release
            tests: true
            install_artifact: true
          - platform: ubuntu-24.04-arm
            build_type: Debug
            tests: false
            install_artifact: false
          - platform: ubuntu-24.04-arm
            build_type: Release
            tests: true
            install_artifact: false
          - platform: macos-latest
            build_type: Release
            tests: true
            install_artifact: true
          - platform: windows-latest
            build_type: Release
            tests: false
            install_artifact: true
    uses: ./.github/workflows/cpp-build.yml
    with:
      platform: ${{ matrix.platform }}
      build-type: ${{ matrix.build_type }}
      tests: ${{ matrix.tests }}
      install-artifact: ${{ matrix.install_artifact }}

  # Both NDEBUG states and linkage definitions, on Linux x64 and ARM.
  clang-tidy:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            build_type: Debug
            shared: 'OFF'
          - platform: ubuntu-24.04-arm
            build_type: Release
            shared: 'ON'
    uses: ./.github/workflows/cpp-lint.yml
    with:
      platform: ${{ matrix.platform }}
      build-type: ${{ matrix.build_type }}
      shared: ${{ matrix.shared }}

  # Stable required check, independent of matrix/reusable-job check names.
  cpp-ci:
    if: always()
    needs: [ check-format, build, clang-tidy ]
    runs-on: ubuntu-latest
    steps:
      - name: Require all C++ checks to pass
        env:
          FORMAT_RESULT: ${{ needs.check-format.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          TIDY_RESULT: ${{ needs.clang-tidy.result }}
        run: |
          test "$FORMAT_RESULT" = success
          test "$BUILD_RESULT" = success
          test "$TIDY_RESULT" = success
